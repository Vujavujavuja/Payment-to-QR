name: "Bug report"
description: Something behaves incorrectly outside of document extraction.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a document the extractor reads wrong, use the **Document extracts
        badly** template instead — it asks for the right things.

        For anything that could let a QR code pay the wrong recipient, **do not
        open an issue**. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        A failing test or a payload string is ideal. If a payment is involved,
        use placeholder values — `265-1234567890-98` is a checksum-valid
        example account that is safe to post.
      render: text
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Web UI
        - src/core (TypeScript library)
        - src/extract (TypeScript extraction)
        - python/ips_qr (Python library)
        - CLI (ips-qr)
        - Build / CI
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0, or the commit SHA"

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, and Node or Python version, whichever is relevant.
      placeholder: "macOS 15, Node 20.11 / Python 3.12"
